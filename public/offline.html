<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — Web3tribe University</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f2a4a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 24px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #b9c4d0; }
    button { margin-top: 24px; background: #b08d2b; color: #0f2a4a; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Web3tribe University needs an internet connection to load new content.<br />Content you've already viewed may still be available.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
